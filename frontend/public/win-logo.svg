<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Four-pane portfolio mark -->
  <defs>
    <linearGradient id="tl" x1="8" y1="8" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EC3F4"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <linearGradient id="tr" x1="52" y1="8" x2="88" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="bl" x1="8" y1="52" x2="44" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="br" x1="52" y1="52" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E879F9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="40" height="40" rx="4" fill="url(#tl)"/>
  <rect x="50" y="6" width="40" height="40" rx="4" fill="url(#tr)"/>
  <rect x="6" y="50" width="40" height="40" rx="4" fill="url(#bl)"/>
  <rect x="50" y="50" width="40" height="40" rx="4" fill="url(#br)"/>
</svg>
