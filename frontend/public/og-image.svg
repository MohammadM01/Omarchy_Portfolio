    <rect x="0" y="156" width="140" height="140" rx="12" fill="url(#bl)"/>
    <rect x="156" y="156" width="140" height="140" rx="12" fill="url(#br)"/>
  </g>
  <text x="520" y="270" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Mohammad Mulla</text>
  <text x="520" y="330" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="28">Software Development Engineer</text>
  <text x="520" y="400" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Open to SDE roles · Mumbai / Remote</text>
