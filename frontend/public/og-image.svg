<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#07080d"/>
  <defs>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6EC3F4"/><stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <linearGradient id="tr" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F472B6"/><stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E879F9"/><stop offset="1" stop-color="#38BDF8"/>
